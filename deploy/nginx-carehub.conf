# CareHub demo (docker compose: /srv/projects/carehub)
# proxy_pass must use the same port as CAREHUB_PORT in .env (default 8040).
# Check with: python tools/check_config.py --nginx deploy/nginx-carehub.conf
server {
    server_name carehub.imisstech.com.au;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live status updates use websockets; AI chat answers stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen [2a02:4780:5e:903a::1]:443 ssl; # managed by Certbot
    listen 72.60.43.188:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/carehub.imisstech.com.au/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/carehub.imisstech.com.au/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = carehub.imisstech.com.au) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name carehub.imisstech.com.au;
    return 404; # managed by Certbot


}