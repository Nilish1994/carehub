name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Byte-compile
        run: python -m compileall -q seed tools tests
      - name: Tests (includes docker compose config cross-check; Docker is on the runner)
        run: python -m pytest -v -rs
      - name: Demo PDFs are reproducible
        run: |
          python seed/make_docs.py "$RUNNER_TEMP/a"
          python seed/make_docs.py "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
      - name: Example configuration renders under Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
